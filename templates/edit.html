<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Event</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<nav class="navbar">

    <div class="logo">
        My Day Analyzer
    </div>

    <div class="nav-buttons">

        <a href="/" class="nav-link">
            ← Back
        </a>

        <button
            onclick="toggleTheme()"
            class="theme-button"
        >
            🌙
        </button>

    </div>

</nav>


<div class="container">


<section class="panel edit-panel">

    <h1>
        ✏️ Edit Event
    </h1>

    <p class="edit-description">
        Change your task or recurring routine.
    </p>


    <form
        action="/edit/{{ event.id }}"
        method="POST"
        class="task-form"
    >


        <div class="form-group full">

            <label>
                Event name
            </label>

            <input
                type="text"
                name="title"
                value="{{ event.title }}"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Time
            </label>

            <input
                type="time"
                name="event_time"
                value="{{ event.event_time }}"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Priority
            </label>

            <select name="priority">

                <option
                    value="High"
                    {% if event.priority == 'High' %}
                        selected
                    {% endif %}
                >
                    🔴 High
                </option>

                <option
                    value="Medium"
                    {% if event.priority == 'Medium' %}
                        selected
                    {% endif %}
                >
                    🟡 Medium
                </option>

                <option
                    value="Low"
                    {% if event.priority == 'Low' %}
                        selected
                    {% endif %}
                >
                    🟢 Low
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Repeat
            </label>

            <select name="recurrence">

                <option
                    value="none"
                    {% if event.recurrence == 'none' %}
                        selected
                    {% endif %}
                >
                    Don't repeat
                </option>

                <option
                    value="daily"
                    {% if event.recurrence == 'daily' %}
                        selected
                    {% endif %}
                >
                    Every day
                </option>

                <option
                    value="weekdays"
                    {% if event.recurrence == 'weekdays' %}
                        selected
                    {% endif %}
                >
                    Weekdays
                </option>

                <option
                    value="weekly"
                    {% if event.recurrence == 'weekly' %}
                        selected
                    {% endif %}
                >
                    Every week
                </option>

                <option
                    value="monthly"
                    {% if event.recurrence == 'monthly' %}
                        selected
                    {% endif %}
                >
                    Every month
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Start date
            </label>

            <input
                type="date"
                name="start_date"
                value="{{ event.start_date }}"
                required
            >

        </div>


        <div class="form-group">

            <label>
                End date
            </label>

            <input
                type="date"
                name="end_date"
                value="{{ event.end_date or '' }}"
            >

        </div>


        <div class="form-submit">

            <button
                type="submit"
                class="primary-button"
            >
                💾 Save Changes
            </button>

            <a
                href="/"
                class="cancel-button"
            >
                Cancel
            </a>

        </div>


    </form>

</section>


</div>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>


</body>

</html>
